services:
  ros_robot:
    build:
      context: ./docker
      dockerfile: Dockerfile
      # image: ros2-lyrical-gazebo:jetty
    image: ros2-jazzy-gazebo:jetty
    container_name: ros-robot-container
    network_mode: host
    privileged: true

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0

    volumes:
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./ros_ws:/root/ros_ws
      - ./dev_ws:/root/dev_ws
      - ./uros_ws:/root/uros_ws
      - ./.ros:/root/.ros
      - "/dev:/dev"
      - "/run/udev:/run/udev:ro"

    # may cause issues in privileged mode
    # devices:
    #   - "/dev/bus/usb:/dev/bus/usb"

    stdin_open: true
    tty: true
    command: bash

